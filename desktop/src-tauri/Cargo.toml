[package]
name = "context-police-desktop"
version = "0.1.0"
description = "Desktop shell for the Context Police local web app"
edition = "2021"
rust-version = "1.77"

[lib]
name = "context_police_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
